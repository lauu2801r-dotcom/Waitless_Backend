# WaitLess · Backend — arranque local con Docker
#
#   Con base de datos externa (Neon):   docker compose up --build
#   Con PostgreSQL local de pruebas:    docker compose --profile localdb up --build
#                                       (y en .env: DATABASE_URL=postgresql://waitless:waitless@db:5432/waitless)
services:
  backend:
    build: .
    image: waitless-backend:latest
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: waitless
      POSTGRES_PASSWORD: waitless
      POSTGRES_DB: waitless
    volumes:
      - waitless_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  waitless_pgdata:
